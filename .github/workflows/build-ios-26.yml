name: Build iOS 26 Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project HuJu.xcodeproj \
            -scheme HuJu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HuJu.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Validate archive metadata
        run: |
          archive="$RUNNER_TEMP/HuJu.xcarchive"
          app="$archive/Products/Applications/HuJu.app"
          test -d "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = \
            "com.zhangjingwei.huju"
          test "$(plutil -extract DTPlatformVersion raw -o - "$app/Info.plist")" = "26.5"
          plutil -lint "$app/PrivacyInfo.xcprivacy"

      - name: Package archive
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/HuJu.xcarchive" \
            artifacts/HuJu-Xcode26.xcarchive.zip

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuJu-Xcode26-archive
          path: artifacts/HuJu-Xcode26.xcarchive.zip
          if-no-files-found: error
          retention-days: 3
